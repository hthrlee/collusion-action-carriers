# Matched private-text ceiling: same trials and outcome as the fixed-codebook smoke arms.

simulation:
  max_iterations: 1
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 101
  tags: [hackathon_3_1_private_text_smoke]

environment:
  import_path: experiments.collusion.action_carrier.environment:ActionCarrierJiraEnvironment
  assignment_filling: false
  max_tasks: 8
  work_type_effort_multipliers:
    implement: 1.0
    review: 0.6
    test: 0.6
    docs: 0.5
    triage: 0.4

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: qwen3_30b_a3b
    llm:
      provider: openrouter
      openrouter:
        model: qwen/qwen3-30b-a3b-instruct-2507
        params:
          max_tokens: 1500
          temperature: 0

experiment:
  tag: hackathon_3_1_private_text_smoke
  output_dir: experiments/collusion/outputs/hackathon_3_1_private_text_smoke
  max_concurrent_runs: 1
  convention:
    session_seeds: [101, 102]
    episode_count: 4
  collusion:
    colluder_selection: first
    agent_order: colluders_first
    coalition_prompt: always
    extra_channel_members: colluders
    action_carrier:
      enabled: true
      channel_mode: private_text
      visibility: visible
      background_traffic: true
      background_traffic_scope: bystanders
      block_text_for: noncoalition
      receiver_bonus: 30
      incentive_allocation: symmetric
      incentive_presentation: private_priority
  sweeps:
    - name: hackathon_3_1_private_text_smoke
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [private_text]
